<script>
// ===== 問題づくり（盤を作る→答えが1つのまま数字を抜く→解くのに要る手筋で難しさを判定） =====
const GEN_SRC = `
const ALL=0x3FE; // ビット1..9
const ROW=[],COL=[],BOX=[],PEERS=[],UNITS=[];
for(let i=0;i<81;i++){ROW[i]=(i/9)|0;COL[i]=i%9;BOX[i]=((ROW[i]/3)|0)*3+((COL[i]/3)|0);}
for(let u=0;u<9;u++){const r=[],c=[],b=[];for(let i=0;i<81;i++){if(ROW[i]===u)r.push(i);if(COL[i]===u)c.push(i);if(BOX[i]===u)b.push(i);}UNITS.push(r,c,b);}
for(let i=0;i<81;i++){const s=new Set();for(let j=0;j<81;j++)if(j!==i&&(ROW[i]===ROW[j]||COL[i]===COL[j]||BOX[i]===BOX[j]))s.add(j);PEERS[i]=[...s];}
const bits=m=>{let n=0;while(m){m&=m-1;n++;}return n;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
// 解の数を数える（limit で打ち切り）
function count(g,limit){
  const r=new Int32Array(9),c=new Int32Array(9),b=new Int32Array(9);g=g.slice();
  for(let i=0;i<81;i++)if(g[i]){const m=1<<g[i];r[ROW[i]]|=m;c[COL[i]]|=m;b[BOX[i]]|=m;}
  let n=0;
  (function go(){
    if(n>=limit)return;
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!g[i]){const m=ALL&~(r[ROW[i]]|c[COL[i]]|b[BOX[i]]);const k=bits(m);if(k<bc){bc=k;best=i;bm=m;if(k<2)break;}}
    if(best<0){n++;return;}
    if(!bc)return;
    for(let v=1;v<=9;v++)if(bm&(1<<v)){const m=1<<v;g[best]=v;r[ROW[best]]|=m;c[COL[best]]|=m;b[BOX[best]]|=m;go();r[ROW[best]]&=~m;c[COL[best]]&=~m;b[BOX[best]]&=~m;g[best]=0;if(n>=limit)return;}
  })();
  return n;
}
function full(){
  const g=new Array(81).fill(0);
  const r=new Int32Array(9),c=new Int32Array(9),b=new Int32Array(9);
  (function go(i){
    if(i===81)return true;
    const m=ALL&~(r[ROW[i]]|c[COL[i]]|b[BOX[i]]);
    for(const v of shuffle([1,2,3,4,5,6,7,8,9]))if(m&(1<<v)){const k=1<<v;g[i]=v;r[ROW[i]]|=k;c[COL[i]]|=k;b[BOX[i]]|=k;if(go(i+1))return true;r[ROW[i]]&=~k;c[COL[i]]&=~k;b[BOX[i]]&=~k;}
    g[i]=0;return false;
  })(0);
  return g;
}
// 人の手筋で解く。戻り値: 1=単独の数字だけ / 2=ペア・ブロックの絞り込みまで / 3=それでは解けない
function grade(p){
  const g=p.slice(),cand=new Array(81).fill(0);
  for(let i=0;i<81;i++)if(!g[i]){let m=ALL;for(const j of PEERS[i])if(g[j])m&=~(1<<g[j]);cand[i]=m;}
  const place=(i,v)=>{g[i]=v;cand[i]=0;for(const j of PEERS[i])cand[j]&=~(1<<v);};
  let level=1;
  for(;;){
    let moved=false;
    for(let i=0;i<81;i++)if(!g[i]&&bits(cand[i])===1){place(i,31-Math.clz32(cand[i]));moved=true;}
    if(moved)continue;
    for(const u of UNITS){for(let v=1;v<=9;v++){const k=1<<v;let at=-1,n=0;for(const i of u){if(g[i]===v){n=-9;break;}if(!g[i]&&(cand[i]&k)){n++;at=i;}}if(n===1){place(at,v);moved=true;}}}
    if(moved)continue;
    if(g.every(x=>x))return level;
    // 2段目: ブロック内の候補が1列/1行にそろう（ポインティング・クレーミング）、ネイキッドペア
    let el=false;
    for(let ui=0;ui<27;ui++){const u=UNITS[ui];for(let v=1;v<=9;v++){const k=1<<v;const cs=u.filter(i=>!g[i]&&(cand[i]&k));if(cs.length<2)continue;
      for(const key of [ROW,COL,BOX]){if(key===(ui%3===0?ROW:ui%3===1?COL:BOX))continue;const t=key[cs[0]];if(cs.every(i=>key[i]===t)){for(let j=0;j<81;j++)if(!g[j]&&key[j]===t&&!cs.includes(j)&&(cand[j]&k)){cand[j]&=~k;el=true;}}}}}
    for(const u of UNITS){const pr=u.filter(i=>!g[i]&&bits(cand[i])===2);for(let a=0;a<pr.length;a++)for(let b2=a+1;b2<pr.length;b2++)if(cand[pr[a]]===cand[pr[b2]]){const m=cand[pr[a]];for(const j of u)if(!g[j]&&j!==pr[a]&&j!==pr[b2]&&(cand[j]&m)){cand[j]&=~m;el=true;}}}
    if(el){level=2;continue;}
    return 3;
  }
}
const SPEC={easy:{min:36,max:40,want:1},normal:{min:28,max:32,want:1},hard:{min:22,max:27,want:2},oni:{min:17,max:26,want:3}};
function make(lv){
  const s=SPEC[lv],t0=Date.now();let fallback=null;
  for(let tries=0;tries<200;tries++){
    const sol=full(),p=sol.slice();
    const order=shuffle([...Array(41).keys()]); // 点対称に2マスずつ抜く
    const target=s.min+((Math.random()*(s.max-s.min+1))|0);
    let clues=81;
    for(const i of order){
      if(clues<=target)break;
      const j=80-i,a=p[i],b=p[j];
      p[i]=0;p[j]=0;
      const ok=count(p,2)===1&&(s.want===3||grade(p)<=s.want);
      if(ok)clues-=(i===j?1:2);else{p[i]=a;p[j]=b;}
    }
    const lvl=grade(p);
    if(lvl===s.want||(s.want===1&&lvl===1)){return {puzzle:p,solution:sol,level:lvl};}
    if(lvl>=2&&s.want===3&&!fallback)fallback={puzzle:p.slice(),solution:sol,level:lvl};
    if(Date.now()-t0>4000&&fallback)return fallback;
  }
  return fallback;
}
onmessage=e=>postMessage(make(e.data));
`;
const AD=`<div class="kkp-ad"><div class="kkp-ad-label">広告</div><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1298304917726270" data-ad-slot="2937937957" data-full-width-responsive="false"></ins></div>`;
const PETS=['cat1','cat2','cat3']; // 絵を足したらここに追加（img/pets/名前.jpg）
let petNext='';
// 次のクリアで出す絵を先に読み込んでおく（クリアした瞬間に出るように）
function preloadPet(){const k=PETS[(Math.random()*PETS.length)|0],u=`img/pets/${k}.jpg`;const im=new Image();im.onload=()=>{petNext=u;};im.onerror=()=>{petNext='';};im.src=u;}
let worker=null;
try{worker=new Worker(URL.createObjectURL(new Blob([GEN_SRC],{type:'text/javascript'})));}catch(_){}
function generate(lv){
  return new Promise(res=>{
    if(worker){worker.onmessage=e=>res(e.data);worker.postMessage(lv);return;}
    const f=new Function(GEN_SRC.replace('onmessage=e=>postMessage(make(e.data));','return make;'))();
    setTimeout(()=>res(f(lv)),30);
  });
}

// ===== 画面 =====
const LV={easy:{name:'かんたん',desc:'数字が多め。<br>ひと駅で1問'},normal:{name:'ふつう',desc:'じっくり5〜15分'},hard:{name:'むずかしい',desc:'候補の絞り込みが要る'},oni:{name:'鬼',desc:'メモ必須。<br>長い移動に'}};
const $=id=>document.getElementById(id);
const KEY='kkp-nanpure-v1';
let S=null; // {lv,puzzle,solution,cells,memo,miss,elapsed,hist,done}
let sel=-1,memoMode=false,running=false,lastTick=0,lock=0;

function store(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(_){return null;}}
function best(lv,t){try{const k=KEY+'-best',b=JSON.parse(localStorage.getItem(k)||'{}');if(t!=null&&(!b[lv]||t<b[lv])){b[lv]=t;localStorage.setItem(k,JSON.stringify(b));return true;}return b[lv];}catch(_){return null;}}

function showHome(){
  document.body.classList.remove('playing');stop();$('home').classList.remove('hide');$('play').classList.add('hide');$('stat').classList.add('hide');
  const saved=load();$('resumeBtn').classList.toggle('hide',!(saved&&!saved.done));
  if(saved&&!saved.done)$('resumeBtn').textContent=`続きから遊ぶ（${LV[saved.lv].name}・${fmt(saved.elapsed)}）`;
  $('lvList').innerHTML=Object.entries(LV).map(([k,v])=>{const b=best(k);return `<button data-lv="${k}"><b>${v.name}</b><span>${v.desc}${b?`<br>最速 ${fmt(b)}`:''}</span></button>`;}).join('');
}
async function start(lv){
  $('home').classList.add('hide');$('play').classList.add('hide');$('gen').style.display='flex';
  const r=await generate(lv);
  $('gen').style.display='none';
  S={lv,puzzle:r.puzzle,solution:r.solution,cells:r.puzzle.slice(),memo:new Array(81).fill(0),miss:0,elapsed:0,hist:[],done:false};
  sel=S.puzzle.findIndex(v=>!v);store();enterPlay();
  if(window.gtag)gtag('event','nanpure_start',{lv});
}
function enterPlay(){
  preloadPet();
  document.body.classList.add('playing');window.scrollTo(0,0);
  $('home').classList.add('hide');$('play').classList.remove('hide');$('stat').classList.remove('hide');
  $('lvName').textContent=LV[S.lv].name;memoMode=false;syncMemo();render();go();
}

// ===== 時計（見えていない間は止める） =====
function fmt(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function go(){if(!S||S.done)return;running=true;lastTick=performance.now();$('overlay').classList.remove('show');$('pauseBtn').textContent='止める';tick();}
function stop(){if(running&&S){S.elapsed+=performance.now()-lastTick;store();}running=false;}
function live(){if(!S||S.done)return false;if(!running&&!$('overlay').classList.contains('show'))go();return running;}
function tick(){if(!running)return;const now=performance.now();S.elapsed+=now-lastTick;lastTick=now;$('time').textContent=fmt(S.elapsed);setTimeout(tick,500);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(S&&!S.done&&!$('play').classList.contains('hide')&&!$('overlay').classList.contains('show'))go();});
window.addEventListener('pagehide',()=>{stop();});

// ===== 盤の描画 =====
const board=$('board');
for(let i=0;i<81;i++){const d=document.createElement('div');d.className='c'+(i%9===2||i%9===5?' br':'')+(((i/9)|0)===2||((i/9)|0)===5?' bb':'');d.dataset.i=i;d.setAttribute('role','gridcell');board.appendChild(d);}
const padRow=$('pad');
for(let v=1;v<=9;v++){const b=document.createElement('button');b.dataset.v=v;b.innerHTML=`${v}<small></small>`;padRow.appendChild(b);}
const peer=(a,b)=>((a/9)|0)===((b/9)|0)||a%9===b%9||(((a/27)|0)===((b/27)|0)&&(((a%9)/3)|0)===(((b%9)/3)|0));

function render(){
  const cells=board.children,sv=sel>=0?S.cells[sel]:0;
  for(let i=0;i<81;i++){
    const d=cells[i],v=S.cells[i],given=!!S.puzzle[i];
    let cls='c'+(i%9===2||i%9===5?' br':'')+(((i/9)|0)===2||((i/9)|0)===5?' bb':'');
    if(given)cls+=' g';else if(v)cls+=' u';
    if(v&&!given&&v!==S.solution[i])cls+=' err';
    if(i===sel)cls+=' sel';else if(sv&&v===sv)cls+=' same';else if(sel>=0&&peer(i,sel))cls+=' peer';
    d.className=cls;
    if(v)d.textContent=v;
    else if(S.memo[i]){let h='<div class="m">';for(let k=1;k<=9;k++)h+=`<span class="${sv===k?'hl':''}">${S.memo[i]&(1<<k)?k:''}</span>`;d.innerHTML=h+'</div>';}
    else d.textContent='';
  }
  const cnt=new Array(10).fill(0);S.cells.forEach((v,i)=>{if(v&&v===S.solution[i])cnt[v]++;});
  [...padRow.children].forEach(b=>{const v=+b.dataset.v;b.disabled=cnt[v]>=9;if(b.disabled&&lock===v)lock=0;b.classList.toggle('lock',lock===v);b.querySelector('small').textContent=cnt[v]>=9?'':`${9-cnt[v]}`;});
  $('miss').textContent=S.miss;$('time').textContent=fmt(S.elapsed);
}

// ===== 操作 =====
function push(){S.hist.push([S.cells.slice(),S.memo.slice()]);if(S.hist.length>200)S.hist.shift();}
function input(v){
  if(!S||S.done||sel<0||S.puzzle[sel]||!live())return;
  if(memoMode){if(S.cells[sel])return;push();S.memo[sel]^=(1<<v);}
  else{
    if(S.cells[sel]===v)return;
    push();S.cells[sel]=v;S.memo[sel]=0;
    if(v!==S.solution[sel])S.miss++;
    else for(let j=0;j<81;j++)if(peer(j,sel))S.memo[j]&=~(1<<v);
  }
  store();render();check();
}
function erase(){if(!S||sel<0||S.puzzle[sel]||!live())return;if(!S.cells[sel]&&!S.memo[sel])return;push();S.cells[sel]=0;S.memo[sel]=0;store();render();}
function undo(){if(!S||!S.hist.length||!live())return;const [c,m]=S.hist.pop();S.cells=c;S.memo=m;store();render();}
function hint(){
  if(!S||S.done||!live())return;
  let i=sel>=0&&!S.puzzle[sel]&&S.cells[sel]!==S.solution[sel]?sel:-1;
  if(i<0){const empty=[];for(let k=0;k<81;k++)if(S.cells[k]!==S.solution[k])empty.push(k);if(!empty.length)return;i=empty[(Math.random()*empty.length)|0];}
  push();S.cells[i]=S.solution[i];S.memo[i]=0;for(let j=0;j<81;j++)if(peer(j,i))S.memo[j]&=~(1<<S.solution[i]);
  S.hints=(S.hints||0)+1;sel=i;store();render();check();
}
function check(){
  if(!S.cells.every((v,i)=>v===S.solution[i]))return;
  stop();S.done=true;store();
  const rec=best(S.lv,S.elapsed)===true;
  if(window.gtag)gtag('event','nanpure_clear',{lv:S.lv,sec:Math.round(S.elapsed/1000),miss:S.miss,hints:S.hints||0});
  $('card').innerHTML=`${AD}<h3>できました</h3><p>${LV[S.lv].name}</p><div class="big">${fmt(S.elapsed)}</div><p>ミス ${S.miss}回${S.hints?`・ヒント ${S.hints}回`:''}${rec?'<br><b style="color:var(--accent-d)">この難しさで最速です</b>':''}</p>
  <div class="btns"><button class="pri" data-act="next">同じ難しさで次の問題</button><button data-act="home">難しさを選ぶ</button></div>`;
  const ov=$('overlay');if(petNext){ov.style.setProperty('--pet',`url(${petNext})`);ov.classList.add('pet');}
  ov.classList.add('show');
  const ins=$('card').querySelector('ins.adsbygoogle');
  if(ins&&getComputedStyle(ins.parentNode).display!=='none'){try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(_){}}
}

board.addEventListener('click',e=>{const c=e.target.closest('.c');if(!c||!live())return;sel=+c.dataset.i;if(lock&&!S.puzzle[sel]&&(memoMode||!S.cells[sel]))input(lock);else render();});
// 長押しでその数字を固定（続けて同じ数字を入れるとき、指を盤と数字の間で往復させない）
let lpTimer=0,lpFired=false;
padRow.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;lpFired=false;clearTimeout(lpTimer);lpTimer=setTimeout(()=>{lpFired=true;const v=+b.dataset.v;lock=lock===v?0:v;if(navigator.vibrate)navigator.vibrate(15);render();},450);});
['pointerup','pointerleave','pointercancel'].forEach(t=>padRow.addEventListener(t,()=>clearTimeout(lpTimer)));
padRow.addEventListener('contextmenu',e=>e.preventDefault());
padRow.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(lpFired){lpFired=false;return;}const v=+b.dataset.v;if(lock&&lock!==v){lock=0;}input(v);});
$('eraseBtn').onclick=erase;$('undoBtn').onclick=undo;$('hintBtn').onclick=hint;
function syncMemo(){$('memoBtn').classList.toggle('on',memoMode);$('memoBtn').textContent=memoMode?'メモ中':'メモ';$('pad').classList.toggle('memo',memoMode);}
$('memoBtn').onclick=()=>{memoMode=!memoMode;syncMemo();};
$('pauseBtn').onclick=()=>{if(!S||S.done)return;stop();$('pauseBtn').textContent='再開';
  $('card').innerHTML=`<h3>一時停止中</h3><p>${LV[S.lv].name}・${fmt(S.elapsed)}</p><div class="btns"><button data-act="new">同じ難しさで新しい問題</button><button data-act="home">難しさを選び直す</button><button class="pri" data-act="resume">続ける</button></div>`;
  $('overlay').classList.add('show');};
$('resumeBtn').onclick=()=>{S=load();if(S){sel=S.cells.findIndex(v=>!v);enterPlay();}};
$('lvList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const saved=load();if(saved&&!saved.done&&saved.cells.some((v,i)=>v&&!saved.puzzle[i])&&!confirm('途中の問題があります。新しい問題を始めますか？'))return;start(b.dataset.lv);});
$('overlay').addEventListener('click',e=>{const a=e.target.dataset.act;if(!a)return;$('overlay').classList.remove('show','pet');if(a==='resume')go();else if(a==='next'||a==='new')start(S.lv);else showHome();});
// パソコンのキーボード
document.addEventListener('keydown',e=>{
  if(!S||$('play').classList.contains('hide'))return;
  if(e.key>='1'&&e.key<='9'){input(+e.key);return;}
  if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){erase();return;}
  if(e.key==='m'||e.key==='M'){memoMode=!memoMode;syncMemo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){undo();e.preventDefault();return;}
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
  if(mv!=null){e.preventDefault();if(sel<0)sel=0;else{const n=sel+mv;if(n>=0&&n<81&&!(mv===1&&n%9===0)&&!(mv===-1&&sel%9===0))sel=n;}render();}
});
showHome();
</script>
</body>
</html>
